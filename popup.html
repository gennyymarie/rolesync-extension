<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoleSync</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <h1>
        <span class="header-emoji">💼</span>
        RoleSync
      </h1>
      <button id="settings-btn" class="icon-btn" title="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </header>

    <!-- Config Warning -->
    <div id="config-warning" class="warning-banner hidden">
      <span>Airtable not configured</span>
      <button id="open-settings" class="btn-link">Configure</button>
    </div>

    <!-- Loading State -->
    <div id="loading-state" class="state-container">
      <div class="spinner"></div>
      <p class="state-title">Finding job details...</p>
      <p class="state-hint">Scanning the page for job information</p>
    </div>

    <!-- No Job Found State -->
    <div id="no-job-state" class="state-container hidden">
      <div class="state-icon">
        <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
          <circle cx="24" cy="24" r="16" stroke="rgba(0,0,0,0.25)" stroke-width="2" fill="none"/>
          <line x1="36" y1="36" x2="48" y2="48" stroke="rgba(0,0,0,0.25)" stroke-width="2" stroke-linecap="round"/>
          <text x="24" y="29" font-size="16" font-weight="500" text-anchor="middle" fill="rgba(0,0,0,0.3)">?</text>
        </svg>
      </div>
      <p class="state-title">No job posting found</p>
      <p class="state-hint">Navigate to a job posting on LinkedIn, Handshake, ZipRecruiter, or a company career page.</p>
    </div>

    <!-- Main Form -->
    <form id="job-form" class="hidden">
      <!-- Company -->
      <div class="form-group">
        <label for="company">Company <span class="required">*</span></label>
        <input type="text" id="company" name="company" required placeholder="e.g., Google, Apple, Netflix">
      </div>

      <!-- Job Title -->
      <div class="form-group">
        <label for="jobTitle">Job Title <span class="required">*</span></label>
        <input type="text" id="jobTitle" name="jobTitle" required placeholder="e.g., Software Engineer">
      </div>

      <!-- Two-column: Job Type, Work Model -->
      <div class="form-row">
        <div class="form-group half">
          <label for="jobType">Job Type</label>
          <select id="jobType" name="jobType">
            <option value="">Select...</option>
            <option value="Full-time">Full-time</option>
            <option value="Part-time">Part-time</option>
            <option value="Contract">Contract</option>
            <option value="Internship">Internship</option>
            <option value="Temporary">Temporary</option>
          </select>
        </div>
        <div class="form-group half">
          <label for="workModel">Work Model</label>
          <select id="workModel" name="workModel">
            <option value="">Select...</option>
            <option value="Remote">Remote</option>
            <option value="Hybrid">Hybrid</option>
            <option value="On-site">On-site</option>
          </select>
        </div>
      </div>

      <!-- Salary -->
      <div class="form-group">
        <label for="salary">Salary</label>
        <input type="text" id="salary" name="salary" placeholder="e.g., $80,000 - $100,000">
      </div>

      <!-- Location -->
      <div class="form-group">
        <label for="location">Location</label>
        <input type="text" id="location" name="location" placeholder="e.g., San Francisco, CA">
      </div>

      <!-- Two-column: Status, Date Applied -->
      <div class="form-row">
        <div class="form-group half">
          <label for="status">Status</label>
          <select id="status" name="status">
            <option value="Not Applied" selected>Not Applied</option>
            <option value="Applied">Applied</option>
          </select>
        </div>
        <div class="form-group half">
          <label for="dateApplied">Date Applied</label>
          <input type="date" id="dateApplied" name="dateApplied">
        </div>
      </div>

      <!-- Notes -->
      <div class="form-group">
        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" rows="2" placeholder="Add any notes about this opportunity..."></textarea>
      </div>

      <!-- Source & Link -->
      <div class="meta-info">
        <select id="source-badge" class="source-select" name="source">
          <option value="LinkedIn">LinkedIn</option>
          <option value="Handshake">Handshake</option>
          <option value="ZipRecruiter">ZipRecruiter</option>
          <option value="Career Page">Career Page</option>
          <option value="Other">Other</option>
        </select>
        <a href="#" id="job-link" target="_blank" class="view-link">View Job</a>
      </div>

      <!-- Hidden fields -->
      <input type="hidden" id="link" name="link">

      <!-- Error message -->
      <div id="error-message" class="error-message hidden"></div>

      <!-- Submit Button -->
      <button type="submit" id="save-btn" class="save-button">
        <span class="btn-text">Save to Airtable</span>
        <span class="btn-loading hidden">
          <span class="spinner-small"></span>
          Saving...
        </span>
      </button>
    </form>

    <!-- Success State -->
    <div id="success-state" class="state-container success hidden">
      <div class="state-icon success-icon">
        <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
          <circle cx="28" cy="28" r="24" fill="rgba(52,199,89,0.12)" stroke="rgba(52,199,89,0.3)" stroke-width="1.5"/>
          <path d="M18 28L25 35L38 21" stroke="#34C759" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
      </div>
      <p class="state-title">Job saved!</p>
      <p class="state-hint">Your job has been added to Airtable</p>
      <button id="save-another" class="btn-secondary">Save Another Job</button>
    </div>

    <!-- Footer -->
    <footer id="popup-footer" class="popup-footer hidden">
      <div id="connection-status" class="status">
        <span class="status-dot"></span>
        <span id="status-text">Checking connection...</span>
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
