<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Background with 3D effect -->
  <rect x="0" y="4" width="44" height="44" rx="10" fill="#000000"/>
  <rect x="2" y="2" width="44" height="44" rx="10" fill="#FFD400"/>
  <rect x="2" y="2" width="44" height="44" rx="10" fill="none" stroke="#000000" stroke-width="3"/>

  <!-- Briefcase body -->
  <rect x="8" y="20" width="32" height="20" rx="4" fill="#FFFFFF"/>
  <rect x="8" y="20" width="32" height="20" rx="4" fill="none" stroke="#000000" stroke-width="2.5"/>

  <!-- Briefcase handle -->
  <path d="M16 20V14C16 12 18 10 20 10H28C30 10 32 12 32 14V20" stroke="#000000" stroke-width="3" fill="none"/>

  <!-- Briefcase clasp with 3D effect -->
  <rect x="18" y="26" width="12" height="8" rx="2" fill="#4DA3FF"/>
  <rect x="18" y="26" width="12" height="8" rx="2" fill="none" stroke="#000000" stroke-width="2"/>

  <!-- Checkmark on clasp -->
  <path d="M21 30L23 32L27 28" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
