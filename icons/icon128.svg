<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Background shadow for 3D effect -->
  <rect x="4" y="14" width="120" height="120" rx="24" fill="#000000"/>

  <!-- Main background -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="#FFD400"/>
  <rect x="4" y="4" width="120" height="120" rx="24" fill="none" stroke="#000000" stroke-width="4"/>

  <!-- Briefcase body -->
  <rect x="20" y="52" width="88" height="52" rx="10" fill="#FFFFFF"/>
  <rect x="20" y="52" width="88" height="52" rx="10" fill="none" stroke="#000000" stroke-width="4"/>

  <!-- Briefcase handle -->
  <path d="M42 52V38C42 32 48 26 54 26H74C80 26 86 32 86 38V52" stroke="#000000" stroke-width="6" fill="none"/>

  <!-- Briefcase clasp - 3D block -->
  <rect x="48" y="68" width="32" height="20" rx="4" fill="#4DA3FF"/>
  <rect x="48" y="68" width="32" height="20" rx="4" fill="none" stroke="#000000" stroke-width="3"/>

  <!-- Checkmark on clasp -->
  <path d="M54 78L60 84L74 70" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Decorative elements -->
  <circle cx="100" cy="30" r="6" fill="#4FD18B" stroke="#000000" stroke-width="2"/>
  <circle cx="28" cy="40" r="4" fill="#FF7A00" stroke="#000000" stroke-width="2"/>
  <circle cx="108" cy="90" r="5" fill="#8B7BFF" stroke="#000000" stroke-width="2"/>
</svg>
